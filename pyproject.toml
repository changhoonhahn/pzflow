[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pzflow-cosmos"
version = "0.1.0"
description = "COSMOS2020 posterior transfer to broadband photo-z normalizing flows"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["numpy", "scipy", "torch", "nflows", "astropy", "matplotlib"]

[project.optional-dependencies]
notebooks = ["nbformat", "nbclient", "ipykernel", "jupyterlab", "pypdf"]
eazy = ["eazy", "dust_extinction", "extinction", "h5py"]

[tool.setuptools.packages.find]
where = ["src"]
